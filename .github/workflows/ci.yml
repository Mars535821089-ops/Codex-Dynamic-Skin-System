name: Public theme checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-theme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify public release boundary and Git history
        run: node tools/verify-public-boundary.mjs --root .
      - name: Verify generated runtime assets
        run: node tools/sync-runtime-assets.mjs --check
      - name: Verify release version consistency
        run: node tools/verify-release-versions.mjs --root .
      - name: Verify Windows native CI chain
        run: node tools/verify-windows-native-ci.mjs --root .
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file" >/dev/null
          done < <(find runtime tools macos windows -type f \
            \( -name '*.mjs' -o -name '*.js' \) -print)

  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run macOS and portable regressions
        env:
          CODEX_DREAM_SKIN_SKIP_SIGNED_RUNTIME_TESTS: "1"
          CODEX_DREAM_SKIN_SKIP_DOCTOR: "1"
        run: ./macos/tests/run-tests.sh

  windows-tests:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell.exe, pwsh.exe]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Run Windows and portable regressions
        shell: cmd
        run: ${{ matrix.shell }} -NoLogo -NoProfile -ExecutionPolicy RemoteSigned -File .\windows\tests\run-tests.ps1
